# Builds the desktop app for macOS (Apple Silicon and Intel) and Windows, and attaches the installers to a draft
# GitHub release. Runs only when a version tag is pushed (git tag v0.1.0 && git push --tags) or by hand.
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Intro Coach ${{ github.ref_name }}
          releaseBody: |
            Desktop app for macOS and Windows. The first launch downloads the speech model (290 MB).

            macOS builds are not notarized: right-click the app and choose Open the first time.
            Windows may show a SmartScreen warning: choose More info, then Run anyway.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
