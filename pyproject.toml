[project]
name = "intro-coach"
version = "0.1.0"
description = "A local speech coach for your self-introduction: pace, pauses, fillers, pitch, structure and word choice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["speech", "public-speaking", "coaching", "speech-recognition", "prosody", "spacy"]
authors = [
    { name = "lulzx", email = "wiserishabh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.115",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "praat-parselmouth>=0.4.5",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "soxr>=0.5",
    "spacy>=3.8,<3.9",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# only needed if content feedback is switched to Claude (INTRO_COACH_AI_PROVIDER=claude)
ai = [
    "anthropic>=0.70",
]

[project.scripts]
intro-coach = "intro_coach.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
